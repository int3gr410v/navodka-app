<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наводка — мастера Батуми</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Цвета берём из темы Telegram (--tg-theme-*), фирменные — только акценты */
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
  --fg: var(--tg-theme-text-color, #121a2e);
  --muted: var(--tg-theme-hint-color, #7a8296);
  --link: var(--tg-theme-link-color, #2a7de1);
  --line: color-mix(in srgb, var(--muted) 22%, transparent);
  --brand: #7c3aed;
  --brand-grad: linear-gradient(135deg, #d946ef, #4f1fe0);   /* как на аватарке бота */
  --star: #ffb800;
  --ok: #2fa66b;
  --row: 40px;   /* высота строки колеса */
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg2); color: var(--fg);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom, 0); }
.top { padding: 12px 16px 8px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 38px; height: 38px; border-radius: 50%; flex: none; display: block; }
.brand b { font-size: 18px; display: block; }
.city-btn { border: 0; background: none; padding: 0; font: inherit; font-size: 13px; color: var(--link); cursor: pointer; margin-top: -2px; }
/* шторка выбора города */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .35); display: flex; align-items: flex-end; }
.sheet-body { background: var(--bg); width: 100%; max-height: 75vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0)); display: grid; gap: 6px; }
.sheet-body h3 { margin: 0 0 6px; font-size: 17px; }
.country { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
.city-opt { border: 0; background: var(--bg2); border-radius: 12px; padding: 12px 14px; font: inherit; color: var(--fg);
  text-align: left; display: flex; justify-content: space-between; cursor: pointer; }
.city-opt[aria-pressed="true"] { outline: 2px solid var(--brand); }
.city-opt small { color: var(--muted); }
.sheet-note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.search { width: 100%; border: 0; border-radius: 12px; padding: 10px 12px; font: inherit;
  background: var(--bg); color: var(--fg); outline: none; }
.search::placeholder { color: var(--muted); }

/* колесо категорий, как барабан времени в iOS */
.wheel { position: relative; height: calc(var(--row) * 5); background: var(--bg); border-radius: 16px; overflow: hidden; }
.wheel-track { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none;
  padding: calc(var(--row) * 2) 0; perspective: 600px; -webkit-overflow-scrolling: touch; }
.wheel-track::-webkit-scrollbar { display: none; }
.wheel-item { height: var(--row); scroll-snap-align: center; display: flex; align-items: center; justify-content: center;
  gap: 6px; font-size: 17px; cursor: pointer; user-select: none; transform-origin: center; will-change: transform, opacity; }
.wheel-item small { color: var(--muted); font-size: 13px; }
.wheel-lens { position: absolute; left: 10px; right: 10px; top: calc(var(--row) * 2); height: var(--row);
  border-radius: 10px; background: color-mix(in srgb, var(--fg) 7%, transparent); pointer-events: none; }
.wheel::before, .wheel::after { content: ""; position: absolute; left: 0; right: 0; height: calc(var(--row) * 1.6);
  pointer-events: none; z-index: 1; }
.wheel::before { top: 0; background: linear-gradient(var(--bg), transparent); }
.wheel::after { bottom: 0; background: linear-gradient(transparent, var(--bg)); }
/* на компьютере (мышь) показываем полосу прокрутки, чтобы было видно, что колесо листается */
@media (hover: hover) and (pointer: fine) {
  .wheel-track { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 60%, transparent) transparent; }
  .wheel-track::-webkit-scrollbar { display: block; width: 6px; }
  .wheel-track::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 60%, transparent); border-radius: 3px; }
  .wheel::before, .wheel::after { right: 10px; }   /* градиенты не закрывают полосу */
  .wheel-lens { right: 16px; }
  .wheel-track { cursor: grab; }
  .wheel-track.dragging { cursor: grabbing; scroll-snap-type: none; }
}
.hint { color: var(--muted); font-size: 13px; padding: 0 4px; }

.list { padding: 4px 16px 24px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--bg); border-radius: 16px; padding: 14px; display: grid; gap: 6px; cursor: pointer;
  border: 0; text-align: left; font: inherit; color: inherit; width: 100%; }
.card:active { opacity: .85; }
.name { font-weight: 650; font-size: 16px; }
.cats { color: var(--muted); font-size: 13px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.badge { background: var(--bg2); border-radius: 8px; padding: 2px 8px; }
.badge.star b { color: var(--star); }
.badge.rec b { color: var(--ok); }
.price { font-size: 13px; color: var(--muted); }
.badge.unclaimed { color: var(--muted); }
.desc { white-space: pre-line; }
.claim { background: var(--bg); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; font-size: 14px; }
.claim a { color: var(--link); text-decoration: none; font-weight: 600; }
.about { margin-top: 8px; }
.about summary { cursor: pointer; color: var(--muted); }
.about p { margin: 6px 0 0; }
.about .tg-link, .about .rv-link { display: block; margin-top: 10px; }
.rv-link { color: var(--link); font-weight: 600; text-decoration: none; border: 0; background: none; font: inherit;
  font-weight: 600; padding: 0; text-align: left; cursor: pointer; justify-self: start; }
/* шторка: контакт и отзыв */
.btn { border: 0; border-radius: 12px; padding: 13px 14px; font: inherit; font-weight: 650; cursor: pointer;
  text-align: center; text-decoration: none; display: block; }
.btn.primary { background: var(--brand-grad); color: #fff; }
.btn.plain { background: var(--bg2); color: var(--fg); }
.btn[disabled] { opacity: .5; }
.phone { font-size: 20px; font-weight: 650; letter-spacing: .02em; user-select: all; }
.star-pick { display: flex; gap: 6px; justify-content: center; margin: 4px 0; }
.star-pick button { border: 0; background: none; font-size: 36px; line-height: 1; padding: 2px; cursor: pointer;
  color: color-mix(in srgb, var(--muted) 45%, transparent); }
.star-pick button.on { color: var(--star); }
.sheet-body textarea { width: 100%; min-height: 90px; border: 0; border-radius: 12px; padding: 10px 12px; font: inherit;
  background: var(--bg2); color: var(--fg); resize: vertical; outline: none; }
.sheet-err { color: #d64545; font-size: 13px; }
.sheet-err:empty { display: none; }
.me-btn { margin-left: auto; border: 0; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600;
  background: var(--bg); color: var(--fg); cursor: pointer; flex: none; }
/* форма мастера */
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form .lbl { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.form input, .form textarea { width: 100%; border: 0; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px;
  background: var(--bg2); color: var(--fg); outline: none; }
.form textarea { min-height: 110px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 14px; background: var(--bg2); color: var(--fg); cursor: pointer; }
.chip.on { background: var(--brand-grad); color: #fff; }
.detail > .btn.plain { background: var(--bg); }
.claim button.rv-link { font-size: 14px; }
a.note { text-decoration: none; justify-self: start; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }

/* карточка мастера */
.detail { padding: 12px 16px 120px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.panel { background: var(--bg); border-radius: 16px; padding: 16px; display: grid; gap: 8px; }
.panel h2 { margin: 0; font-size: 21px; }
.panel h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.review { border-top: 1px solid var(--line); padding-top: 8px; }
.review:first-of-type { border-top: 0; padding-top: 0; }
.review .stars { color: var(--star); letter-spacing: 1px; }
.quote { border-left: 3px solid var(--ok); padding-left: 10px; }
.note { color: var(--muted); font-size: 13px; }
.cta { display: none; position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0));
  border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 650; background: var(--brand-grad); color: #fff; }
body.no-tg .cta.show { display: block; }
.back { border: 0; background: none; color: var(--link); font: inherit; padding: 0; cursor: pointer; justify-self: start; }
body:not(.no-tg) .back { display: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="home">
  <div class="top">
    <div class="brand" id="brand"></div>
    <input class="search" id="q" type="search" placeholder="Что нужно сделать? Например: повесить полку">
    <div class="wheel" id="wheelBox"><div class="wheel-lens"></div><div class="wheel-track" id="wheel"></div></div>
  </div>
  <div class="list" id="list"></div>
</div>
<div id="detail" hidden></div>
<div id="cabinet" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody"></div></div>
<button class="cta" id="cta" type="button">✉️ Написать мастеру</button>

<script>
const BOT = "navodkaprobot";
// страница отдаётся с нашего сервера; со старого адреса (GitHub Pages) ходим туда же
const API = location.hostname.endsWith("github.io") ? "https://34-61-58-73.sslip.io" : "";
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (!inTg) document.body.classList.add("no-tg");
if (tg) { tg.ready(); tg.expand(); }

const LOGO = `<img src="logo.jpg" alt="">`;   // аватарка бота

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let DATA = { categories: [], masters: [] };
let state = { city: null, cat: "all", q: "", open: null, scroll: 0 };
let WHEEL = [];   // [{key, title}] — первая строка «Все мастера»
const catTitle = k => (DATA.categories.find(c => c.key === k) || {}).title || k;
const score = m => (m.reviews_count + m.recs.length) * 10 + (m.rating || 0);

// запрос к нашему API с подписью Telegram (initData) — по ней сервер знает, кто это
async function api(path, body) {
  const r = await fetch(API + path, {
    method: body ? "POST" : "GET",
    headers: { "X-Init-Data": inTg ? tg.initData : "", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error((await r.text()) || "Что-то пошло не так — попробуйте ещё раз");
  return r.json();
}
const haptic = t => { if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
function openSheet(html) { $("sheetBody").innerHTML = html; $("sheet").hidden = false; }
const closeSheet = () => { $("sheet").hidden = true; };
const NEED_TG = `<h3>Откройте Наводку в Telegram</h3><div class="note">Контакты мастеров и отзывы доступны только в приложении внутри Telegram.</div>
  <a class="btn primary" href="https://t.me/${BOT}">Открыть @${BOT}</a>`;

// ---------- контакт мастера ----------
async function contact(id) {
  if (!inTg) return openSheet(NEED_TG);
  openSheet(`<div class="note">Загружаем контакт…</div>`);
  try {
    const c = await api("/api/contact", { id });
    haptic("success");
    openSheet(`<h3>${esc(c.name)}</h3>
      ${c.username ? `<button class="btn primary" type="button" data-act="chat" data-u="${esc(c.username)}">💬 Написать в Telegram · @${esc(c.username)}</button>` : ""}
      ${c.phone ? `<div class="note" style="margin-top:6px">Телефон</div><div class="phone">${esc(c.phone)}</div>
        <a class="btn plain" href="tel:${esc(c.phone.replace(/[^+\d]/g, ""))}">📞 Позвонить</a>
        <button class="btn plain" type="button" data-act="copy" data-v="${esc(c.phone)}">Скопировать номер</button>` : ""}
      <div class="note" style="margin-top:6px">Скажи мастеру, что ты по Наводке 🙂 Через пару дней спросим, как всё прошло.</div>`);
  } catch (e) { openSheet(`<div class="sheet-err">${esc(e.message)}</div>`); }
}

// ---------- отзыв ----------
let rv = { id: null, rating: 0 };
async function openReview(id) {
  if (!inTg) return openSheet(NEED_TG);
  const m = DATA.masters.find(x => x.id === id);
  rv = { id, rating: 0 };
  let old = {};
  try { old = await api(`/api/review?id=${id}`); } catch (e) {}
  rv.rating = old.rating || 0;
  openSheet(`<h3>Отзыв о мастере ${esc(m.name)}</h3>
    ${old.rating ? `<div class="note">Вы уже оставляли отзыв — новый заменит прежний.</div>` : ""}
    <div class="star-pick" id="stars">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-star="${n}" aria-label="${n}">★</button>`).join("")}</div>
    <textarea id="rvText" maxlength="1000" placeholder="Пару слов: что делал мастер, как всё прошло (необязательно)">${esc(old.text || "")}</textarea>
    <div class="sheet-err" id="rvErr"></div>
    <button class="btn primary" type="button" data-act="send-review" id="rvSend">Отправить отзыв</button>`);
  paintStars();
}
function paintStars() {
  document.querySelectorAll("#stars [data-star]").forEach(b => b.classList.toggle("on", +b.dataset.star <= rv.rating));
}
async function sendReview() {
  if (!rv.rating) { $("rvErr").textContent = "Поставьте оценку — от 1 до 5 звёзд"; return; }
  $("rvSend").disabled = true;
  try {
    await api("/api/review", { id: rv.id, rating: rv.rating, text: $("rvText").value });
    haptic("success");
    openSheet(`<h3>Спасибо! 🙏</h3><div class="note">Отзыв опубликован и поможет другим выбрать мастера.</div>
      <button class="btn plain" type="button" data-act="close">Готово</button>`);
    await loadCatalog();   // обновить рейтинг и отзывы в карточке
    if (state.open) openDetail(state.open);
  } catch (e) { $("rvErr").textContent = e.message; $("rvSend").disabled = false; }
}

// ---------- поиск: по мастеру и по словам задач его категорий ----------
function haystack(m) {
  const kw = m.categories.map(k => (DATA.categories.find(c => c.key === k) || {}).keywords || "");
  return [m.name, m.description, m.prices, m.district, ...m.categories.map(catTitle), ...kw].join(" ").toLowerCase();
}
function matches(m, q) {
  const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return true;
  const h = haystack(m);
  // сравниваем по основе слова, чтобы «полку» нашло «полка», а «повесить» — «повесить»
  const stem = w => w.length > 5 ? w.slice(0, 5) : w.slice(0, Math.max(3, w.length - 1));
  return words.some(w => h.includes(stem(w)));
}
const inCity = () => DATA.masters.filter(m => m.city_id === state.city);
function filtered() {
  return inCity()
    .filter(m => state.q.trim() ? true : state.cat === "all" || m.categories.includes(state.cat))
    .filter(m => matches(m, state.q))
    .sort((a, b) => score(b) - score(a));
}

// ---------- колесо ----------
function buildWheel() {
  const ms = inCity();
  const counts = Object.fromEntries(DATA.categories.map(c => [c.key, ms.filter(m => m.categories.includes(c.key)).length]));
  WHEEL = [{ key: "all", title: "Все мастера", n: ms.length }].concat(DATA.categories.map(c => ({ ...c, n: counts[c.key] })));
  $("wheel").innerHTML = WHEEL.map((c, i) => `<div class="wheel-item" data-i="${i}">${esc(c.title)}<small>${c.n}</small></div>`).join("");
  paintWheel();
}
const rowH = () => $("wheel").querySelector(".wheel-item").offsetHeight;
function paintWheel() {
  const t = $("wheel"), pos = t.scrollTop / rowH();
  t.querySelectorAll(".wheel-item").forEach((el, i) => {
    const d = i - pos;
    el.style.transform = `rotateX(${Math.max(-70, Math.min(70, -d * 20))}deg)`;
    el.style.opacity = Math.max(0.15, 1 - Math.abs(d) * 0.3);
    el.style.fontWeight = Math.abs(d) < 0.5 ? 650 : 400;
  });
}
let lastIdx = 0, settle;
$("wheel").addEventListener("scroll", () => {
  paintWheel();
  const idx = Math.round($("wheel").scrollTop / rowH());
  if (idx !== lastIdx) { lastIdx = idx; if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }
  clearTimeout(settle);
  settle = setTimeout(() => {
    const c = WHEEL[idx];
    if (c && c.key !== state.cat) { state.cat = c.key; if (state.q) { state.q = ""; $("q").value = ""; } renderList(); }
  }, 120);
}, { passive: true });
// колёсико мыши / тачпад: один «щелчок» = одна категория (иначе мышь проскакивает 2–3 строки)
let wheelAcc = 0, wheelLock = false;
$("wheel").addEventListener("wheel", e => {
  e.preventDefault();
  wheelAcc += e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;   // deltaMode 1 — прокрутка строками (Firefox)
  if (wheelLock || Math.abs(wheelAcc) < 25) return;
  const t = $("wheel"), dir = Math.sign(wheelAcc);
  wheelAcc = 0;
  const idx = Math.min(WHEEL.length - 1, Math.max(0, Math.round(t.scrollTop / rowH()) + dir));
  t.scrollTo({ top: idx * rowH(), behavior: "smooth" });
  wheelLock = true;
  setTimeout(() => { wheelLock = false; }, 110);
}, { passive: false });
// перетаскивание мышью, как пальцем: тянешь, отпускаешь — докрутка до ближайшей категории с инерцией
let drag = null, dragMoved = false;
$("wheel").addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  const t = $("wheel");
  drag = { y: e.clientY, top: t.scrollTop, lastY: e.clientY, lastT: performance.now(), v: 0 };
  dragMoved = false;
  t.setPointerCapture(e.pointerId);
  t.classList.add("dragging");
});
$("wheel").addEventListener("pointermove", e => {
  if (!drag) return;
  const t = $("wheel"), now = performance.now(), dy = e.clientY - drag.y;
  if (Math.abs(dy) > 3) dragMoved = true;
  t.scrollTop = drag.top - dy;
  drag.v = (e.clientY - drag.lastY) / Math.max(1, now - drag.lastT);   // px/мс, для инерции
  drag.lastY = e.clientY; drag.lastT = now;
});
function endDrag() {
  if (!drag) return;
  const t = $("wheel"), target = t.scrollTop - drag.v * 150;
  drag = null;
  t.classList.remove("dragging");
  const idx = Math.min(WHEEL.length - 1, Math.max(0, Math.round(target / rowH())));
  t.scrollTo({ top: idx * rowH(), behavior: "smooth" });
}
$("wheel").addEventListener("pointerup", endDrag);
$("wheel").addEventListener("pointercancel", endDrag);
$("wheel").addEventListener("click", e => {
  if (dragMoved) { dragMoved = false; return; }   // это было перетаскивание, а не нажатие
  const it = e.target.closest(".wheel-item");
  if (it) $("wheel").scrollTo({ top: +it.dataset.i * rowH(), behavior: "smooth" });
});

// ---------- список ----------
function badges(m) {
  const out = [];
  if (m.rating) out.push(`<span class="badge star"><b>★ ${m.rating.toFixed(1)}</b> · ${m.reviews_count} отз.</span>`);
  if (m.recs.length) out.push(`<span class="badge rec"><b>👍 ${m.recs.length}</b> в чатах</span>`);
  if (m.district) out.push(`<span class="badge">📍 ${esc(m.district)}</span>`);
  if (!m.claimed) out.push(`<span class="badge unclaimed">не подтверждён</span>`);
  return out.join("");
}
function renderList() {
  const rows = filtered();
  const head = state.q.trim() ? `<div class="hint">Поиск по всем категориям: «${esc(state.q.trim())}»</div>` : "";
  const about = `<details class="claim about"><summary>ℹ️ О сервисе</summary>
    <p class="note"><b>Наводка</b> помогает быстро найти мастера по ремонту и быту: сантехника, электрика, мастера на час,
    клининг и других. Смотрите отзывы клиентов и рекомендации из местных чатов и пишите мастеру напрямую — без посредников и комиссий.</p>
    <p class="note">Часть профилей создана по объявлениям, которые мастера сами опубликовали в открытых Telegram-чатах.
    В них только публичная информация — текст объявления и контакты, указанные мастером. Такие профили помечены «не подтверждён».</p>
    <p class="note">Вы мастер и не хотите быть в каталоге? Откройте свой профиль и нажмите «Это мой профиль — удалить».

  $("list").innerHTML = head + (rows.length ? rows.map(m => `

}
$("q").addEventListener("input", () => { state.q = $("q").value; renderList(); });
// ссылки на бота внутри Telegram открываем через openTelegramLink и закрываем приложение
document.addEventListener("click", e => {

});
$("list").addEventListener("click", e => {

// ---------- карточка мастера ----------

  state.open = id;
  $("detail").innerHTML = `
    <div class="detail">

        <h2>${esc(m.name)}</h2>
        <div class="cats">${m.categories.map(catTitle).map(esc).join(" · ")}</div>

      </div>
      <div class="panel"><h3>Отзывы клиентов</h3>${m.reviews.length ? m.reviews.map(r => `
        <div class="review"><div class="stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</div><div>${esc(r.text)}</div><div class="note">${esc(r.date)}</div></div>`).join("") : `<div class="note">Пока нет отзывов. Обращались к этому мастеру? Расскажите, как всё прошло.</div>`}
        <button type="button" class="rv-link" data-act="review">⭐ Оставить отзыв ›</button></div>
      ${m.claimed ? "" : `<div class="claim">
        <div class="note">Профиль создан по объявлению, которое мастер сам опубликовал в открытых Telegram-чатах. Здесь только эта публичная информация: текст объявления и контакты из него. Мастер профиль ещё не подтвердил.</div>
        <button type="button" class="rv-link" data-act="claim">Это мой профиль — подтвердить ›</button>
        <button type="button" class="rv-link" data-act="unclaim">Это мой профиль — удалить ›</button>
      </div>`}
      ${m.recs.length ? `<div class="panel"><h3>Рекомендации в чатах Батуми</h3>${m.recs.slice(0, 5).map(q => `<div class="quote">«${esc(q)}»</div>`).join("")}</div>` : ""}
      <p class="note">Через пару дней бот спросит, как всё прошло, — твой отзыв поможет другим.</p>

  $("home").hidden = true; $("detail").hidden = false;

  if (tg) {

  }
  $("cta").classList.add("show");
}
function closeDetail() {
  state.open = null;
  $("detail").hidden = true; $("home").hidden = false;
  window.scrollTo(0, state.scroll);
  $("cta").classList.remove("show");
  if (tg) { tg.MainButton.hide(); tg.BackButton.hide(); }
}
$("cta").addEventListener("click", () => state.open && contact(state.open));
$("detail").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (!a || !state.open) return;
  const id = state.open, act = a.dataset.act;
  if (act === "review") openReview(id);
  if (act === "claim") claimFlow(id, "claim");
  if (act === "unclaim") claimFlow(id, "delete");
  if (act === "report") openReport(id);
});
if (tg) {
  tg.BackButton.onClick(goBack);
  tg.MainButton.onClick(() => state.open && contact(state.open));
}

// ---------- кабинет мастера («Я мастер») ----------
let ME = null;        // ответ /api/me
let draft = null;     // заполненная форма — сохраняем, пока подтверждает номер или решает про найденный профиль
const canShareContact = () => inTg && tg.requestContact && (!tg.isVersionAtLeast || tg.isVersionAtLeast("6.9"));

function showCabinet() {
  $("home").hidden = true; $("detail").hidden = true; $("cabinet").hidden = false;
  $("cta").classList.remove("show");
  if (tg) { tg.MainButton.hide(); tg.BackButton.show(); }
  window.scrollTo(0, 0);
}
function closeCabinet() {
  $("cabinet").hidden = true;
  if (state.open) openDetail(state.open);
  else { $("home").hidden = false; if (tg) tg.BackButton.hide(); window.scrollTo(0, state.scroll); }
}
function goBack() {
  if (!$("sheet").hidden) return closeSheet();
  if (!$("cabinet").hidden) return closeCabinet();
  closeDetail();
}

async function openCabinet() {
  state.open = null;
  showCabinet();
  if (!inTg) { $("cabinet").innerHTML = `<div class="detail"><div class="panel">${NEED_TG}</div></div>`; return; }
  $("cabinet").innerHTML = `<div class="detail"><div class="note">Загружаем…</div></div>`;
  try { ME = await api("/api/me"); } catch (e) { $("cabinet").innerHTML = `<div class="detail"><div class="sheet-err">${esc(e.message)}</div></div>`; return; }
  renderCabinet();
}

function renderCabinet() {
  const back = `<button class="back" type="button" data-act="cab-back">← Назад</button>`;
  if (ME.profile) return renderProfile(back);
  if (ME.found.length && !draft) {   // профиль по его объявлению уже есть — предлагаем забрать, а не плодить дубль
    const f = ME.found[0];
    $("cabinet").innerHTML = `<div class="detail">${back}
      <div class="panel"><h2>👋 Ваш профиль уже есть</h2>
        <div><b>${esc(f.name)}</b> — мы добавили его по вашему публичному объявлению в чатах.</div>
        <div class="note">Заберите его: метка «не подтверждён» исчезнет, отзывы и рекомендации сохранятся, и вы сможете всё поправить.</div>
        <button class="btn primary" type="button" data-act="take" data-id="${f.id}">✅ Это я — забрать профиль</button>
        <button class="btn plain" type="button" data-act="view" data-id="${f.id}">Посмотреть профиль</button>
        <button class="btn plain" type="button" data-act="del-found" data-id="${f.id}">🗑 Удалить его из каталога</button>
      </div></div>`;
    return;
  }
  $("cabinet").innerHTML = `<div class="detail">${back}
    <div class="panel"><h2>🛠 Добавьтесь в Наводку</h2>
      <div class="note">Бесплатно. Клиенты увидят ваш профиль и отзывы и напишут вам напрямую — без посредников и комиссий.</div></div>
    ${formHtml(draft || {})}
    <div class="sheet-err" id="cabErr"></div>
    <button class="btn primary" type="button" data-act="save">Опубликовать профиль</button>
    <p class="note">Публикуя профиль, вы соглашаетесь, что его увидят клиенты в каталоге Наводки. Скрыть или удалить его можно в любой момент здесь же.</p>
  </div>`;
}

function renderProfile(back) {
  const p = ME.profile, visible = p.status === "active";
  const stats = [`✉️ За 30 дней вам написали: <b>${p.contacts30}</b>`];
  stats.push(p.rating ? `⭐ <b>${p.rating.toFixed(1)}</b> · отзывов: ${p.reviews_count}` : "⭐ Отзывов пока нет");
  const contactLine = [p.username ? "@" + p.username : "", p.phone || ""].filter(Boolean).join(" · ") || "—";
  $("cabinet").innerHTML = `<div class="detail">${back}
    <div class="panel"><h2>Мой профиль</h2>
      <div>${visible ? "✅ Виден в каталоге" : "⏸ Скрыт — клиенты его не видят"}</div>
      <div class="note">${stats.join("<br>")}</div>
      <div class="note">Контакт для клиентов: ${esc(contactLine)}</div>
      ${visible ? `<button class="rv-link" type="button" data-act="view" data-id="${p.id}">Как видят клиенты ›</button>` : ""}
    </div>
    ${formHtml(p)}
    <div class="sheet-err" id="cabErr"></div>
    <button class="btn primary" type="button" data-act="save">Сохранить</button>
    <button class="btn plain" type="button" data-act="${visible ? "hide" : "show"}">${visible ? "⏸ Скрыть на время" : "▶️ Показать в каталоге"}</button>
    <button class="btn plain" type="button" data-act="del-mine">🗑 Удалить профиль</button>

}

function formHtml(v) {
  const cats = v.categories || [];
  const phone = v.phone || ME.phone_verified || "";
  const shareBtn = canShareContact() ? `<button class="btn plain" type="button" data-act="share-phone">📱 Подставить мой номер из Telegram</button>` : "";
  const phoneNote = ME.username ? `Клиенты смогут написать вам в Telegram: @${esc(ME.username)}. Телефон — по желанию.`
                                : "У вас нет @username в Telegram, поэтому клиентам нужен телефон.";
  return `<div class="panel form">
    <label>Имя<input id="f_name" maxlength="80" value="${esc(v.name || "")}" placeholder="Олег — сантехник или название бригады"></label>
    <div><div class="lbl">Чем занимаетесь</div><div class="chips" id="f_cats">${DATA.categories.map(c =>
      `<button type="button" class="chip${cats.includes(c.key) ? " on" : ""}" data-cat="${c.key}">${esc(c.title)}</button>`).join("")}</div></div>

    <label>О себе<textarea id="f_description" maxlength="2000" placeholder="Что делаете, опыт, гарантия — клиенты читают это в первую очередь">${esc(v.description || "")}</textarea></label>
    <label><span>Цены <span class="note">· необязательно</span></span><input id="f_prices" maxlength="300" value="${esc(v.prices || "")}" placeholder="Выезд 30 ₾, замена смесителя от 50 ₾"></label>
    <label>Телефон<input id="f_phone" maxlength="40" inputmode="tel" value="${esc(phone)}" placeholder="+995 555 12 34 56"></label>
    <div class="note">${phoneNote}</div>
    ${shareBtn}
  </div>`;
}

function readForm() {
  return {
    name: $("f_name").value, district: $("f_district").value, description: $("f_description").value,
    prices: $("f_prices").value, phone: $("f_phone").value,
    categories: [...document.querySelectorAll("#f_cats .chip.on")].map(b => b.dataset.cat),
  };
}

async function cabinetAction(a, el) {
  const err = t => { const e = $("cabErr"); if (e) e.textContent = t; else openSheet(`<div class="sheet-err">${esc(t)}</div>`); };
  try {
    if (a === "cab-back") return closeCabinet();
    if (a === "view") { const id = +el.dataset.id; $("cabinet").hidden = true; return openDetail(id); }
    if (a === "save") {
      const f = readForm();
      el.disabled = true;
      // новый мастер с подтверждённым номером из объявления — сначала предложим забрать тот профиль
      if (!ME.profile && ME.found.length && draft) {
        const r = await api("/api/claim", { id: ME.found[0].id, action: "claim", profile: f });
        ME.profile = r.profile; draft = null;
      } else {
        ME.profile = (await api("/api/profile", { ...f, city_id: state.city })).profile;
      }
      haptic("success");
      await loadCatalog(); renderCabinet();
      openSheet(`<h3>Готово ✅</h3><div class="note">Профиль сохранён — клиенты уже видят изменения.</div>
        <button class="btn plain" type="button" data-act="close">Хорошо</button>`);
      return;
    }
    if (a === "take") {
      const r = await api("/api/claim", { id: +el.dataset.id, action: "claim" });
      ME.profile = r.profile; haptic("success"); await loadCatalog(); return renderCabinet();
    }
    if (a === "hide" || a === "show") {
      ME.profile = (await api("/api/profile/status", { action: a })).profile;
      await loadCatalog(); return renderCabinet();
    }
    if (a === "del-mine") return confirmSheet("Удалить профиль вместе с отзывами? Это нельзя отменить. Если нужен перерыв — лучше «Скрыть на время».",
      "🗑 Да, удалить навсегда", async () => {
        await api("/api/profile/status", { action: "delete" });
        ME.profile = null; ME.found = []; await loadCatalog(); renderCabinet();
        openSheet(`<h3>Профиль удалён</h3><div class="note">Захотите вернуться — откройте «Я мастер».</div>`);
      });
    if (a === "del-found") return claimFlow(+el.dataset.id, "delete");
    if (a === "share-phone") return sharePhone(el);
  } catch (e) { err(e.message); el.disabled = false; }
}
$("cabinet").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { chip.classList.toggle("on"); if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); return; }
  const el = e.target.closest("[data-act]");
  if (el) cabinetAction(el.dataset.act, el);
});

// номер из Telegram: ответ requestContact подписан — сервер проверяет, что номер действительно ваш
function sharePhone(el) {
  tg.requestContact(async (ok, resp) => {
    if (!ok) return;
    try {
      if (resp && resp.response) await api("/api/phone", { response: resp.response });
      else await new Promise(r => setTimeout(r, 1500));   // старые версии: номер придёт боту, он его сохранит
    } catch (e) {}
    const keep = $("f_name") ? readForm() : null;
    ME = await api("/api/me");
    if (keep) keep.phone = ME.phone_verified || keep.phone;
    if (!ME.profile && ME.found.length) {   // по номеру нашли его профиль из объявления
      draft = keep;
      return openSheet(`<h3>👋 Нашли ваш профиль</h3>
        <div><b>${esc(ME.found[0].name)}</b> — мы добавили его по вашему публичному объявлению.</div>
        <div class="note">Обновим его тем, что вы заполнили? Отзывы и рекомендации сохранятся, метка «не подтверждён» исчезнет.</div>
        <button class="btn primary" type="button" data-act="merge">✅ Да, это я — обновить его</button>
        <button class="btn plain" type="button" data-act="no-merge">Нет, создать новый</button>`);
    }
    if ($("f_phone") && ME.phone_verified) $("f_phone").value = ME.phone_verified;
  });
}

function confirmSheet(text, yes, onYes) {
  openSheet(`<div>${esc(text)}</div><button class="btn primary" type="button" data-act="yes">${esc(yes)}</button>
    <button class="btn plain" type="button" data-act="close">Отмена</button>`);
  pendingYes = onYes;
}
let pendingYes = null;

// «Это мой профиль» на карточке из объявления
async function claimFlow(id, action, askAdmin = false) {
  if (!inTg) return openSheet(NEED_TG);
  const run = async () => {
    const r = await api("/api/claim", { id, action, ask_admin: askAdmin });
    if (r.sent_to_admin) return openSheet(`<h3>Запрос отправлен</h3><div class="note">Мы передали его администратору — он проверит и ответит вам в Telegram.</div>
      <button class="btn plain" type="button" data-act="close">Хорошо</button>`);
    if (r.not_owner) {
      claimPending = { id, action };
      return openSheet(`<h3>Подтвердите, что профиль ваш</h3>
        <div class="note">Объявление было опубликовано с другого аккаунта. Если в нём был ваш номер телефона — подтвердите его через Telegram, и всё произойдёт сразу.</div>
        ${canShareContact() ? `<button class="btn primary" type="button" data-act="claim-phone">📱 Подтвердить номером телефона</button>` : ""}
        <button class="btn plain" type="button" data-act="claim-admin">Попросить администратора</button>`);
    }
    await loadCatalog();
    if (action === "delete") {
      closeSheet(); if (!$("detail").hidden) closeDetail();
      ME = null; if (!$("cabinet").hidden) openCabinet();
      return openSheet(`<h3>Профиль удалён</h3><div class="note">Он исчез из каталога, и мы больше не будем его добавлять. Извините за беспокойство!</div>
        <button class="btn plain" type="button" data-act="close">Хорошо</button>`);
    }
    closeSheet(); haptic("success");
    await openCabinet();
  };
  if (action === "delete" && !askAdmin) {
    return confirmSheet("Удалить этот профиль из каталога? Он исчезнет сразу, и мы больше не будем его добавлять.", "🗑 Да, удалить", run);
  }
  try { await run(); } catch (e) { openSheet(`<div class="sheet-err">${esc(e.message)}</div>`); }
}
let claimPending = null;

// ---------- сообщить об ошибке ----------
let reportCtx = null;
function openReport(masterId) {
  if (!inTg) return openSheet(NEED_TG);
  reportCtx = masterId || null;
  openSheet(`<h3>🐞 Сообщить об ошибке</h3>
    <div class="note">Опишите, что не так: что делали и что пошло не по плану.</div>
    <textarea id="repText" maxlength="3000"></textarea><div class="sheet-err" id="repErr"></div>
    <button class="btn primary" type="button" data-act="send-report" id="repSend">Отправить</button>`);
}
async function sendReport() {
  $("repSend").disabled = true;
  try {
    await api("/api/report", { text: $("repText").value, master_id: reportCtx });
    haptic("success");
    openSheet(`<h3>Спасибо! 🙏</h3><div class="note">Сообщение получили — разберёмся.</div>
      <button class="btn plain" type="button" data-act="close">Хорошо</button>`);
  } catch (e) { $("repErr").textContent = e.message; $("repSend").disabled = false; }

// действия в шторке, связанные с кабинетом, «Это мой профиль» и ошибками
async function sheetAction(a, el) {
  try {
    if (a === "yes") { const f = pendingYes; pendingYes = null; return f && await f(); }
    if (a === "send-report") return sendReport();
    if (a === "merge") {
      const f = draft || readForm();
      const r = await api("/api/claim", { id: ME.found[0].id, action: "claim", profile: f });
      ME.profile = r.profile; draft = null; closeSheet(); haptic("success"); await loadCatalog(); return renderCabinet();
    }
    if (a === "no-merge") { ME.found = []; closeSheet(); return renderCabinet(); }
    if (a === "claim-admin") return claimFlow(claimPending.id, claimPending.action, true);
    if (a === "claim-phone") {
      return tg.requestContact(async (ok, resp) => {
        if (!ok) return;
        try {
          if (resp && resp.response) await api("/api/phone", { response: resp.response });
          else await new Promise(r => setTimeout(r, 1500));
        } catch (e) {}
        claimFlow(claimPending.id, claimPending.action, false).then(() => {});
      });
    }
  } catch (e) { openSheet(`<div class="sheet-err">${esc(e.message)}</div>`); }
}
const SHEET_ACTS = ["yes", "send-report", "merge", "no-merge", "claim-admin", "claim-phone"];

// ---------- ссылки из бота: ?m=12 мастер, ?rv=12 отзыв, ?me=1 «Я мастер», ?report=app или ?report=12 ----------
function openFromLink() {
  const q = new URLSearchParams(location.search);
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";   // t.me/…?startapp=rv12 и т.п.
  const m = sp.match(/^(m|rv|report)(\d+)$/);
  if (m) q.set(m[1], m[2]);
  if (sp === "me") q.set("me", "1");
  if (sp === "report") q.set("report", "app");
  const has = id => DATA.masters.some(x => x.id === id);
  // мастер из другого города — переключаем город, чтобы «Назад» вёл в его список
  const city = id => { const x = DATA.masters.find(y => y.id === id); if (x && x.city_id !== state.city) setCity(x.city_id); };
  if (q.has("me")) return openCabinet();
  if (q.has("rv") && has(+q.get("rv"))) { city(+q.get("rv")); openDetail(+q.get("rv")); return openReview(+q.get("rv")); }
  if (q.has("m") && has(+q.get("m"))) { city(+q.get("m")); return openDetail(+q.get("m")); }
  if (q.has("report")) {
    const id = +q.get("report");
    if (has(id)) { city(id); openDetail(id); return openReport(id); }
    return openReport();
  }
}

// ---------- город ----------
const allCities = () => DATA.countries.flatMap(c => c.cities.map(x => ({ ...x, country: c.name, flag: c.flag })));
function cityLabel() {
  const c = allCities().find(x => x.id === state.city);
  return c ? `📍 ${c.country}, ${c.name} ▾` : "📍 Выбрать город ▾";
}
const countMasters = ids => DATA.masters.filter(m => ids.includes(m.city_id)).length;
function renderBrand() {
  $("brand").innerHTML = `${LOGO}<div><b>Наводка</b><button class="city-btn" id="cityBtn" type="button">${esc(cityLabel())}</button></div>
    <button class="me-btn" id="meBtn" type="button">🛠 Я мастер</button>`;
  $("cityBtn").addEventListener("click", openCities);
  $("meBtn").addEventListener("click", openCabinet);
}
// шаг 1 — страна, шаг 2 — город
function openCities() {
  const cur = allCities().find(x => x.id === state.city);
  $("sheetBody").innerHTML = `<h3>Страна</h3>` + DATA.countries.map(co => `
    <button class="city-opt" type="button" data-country="${co.code}" aria-pressed="${!!cur && cur.country === co.name}">
      <span>${co.flag} ${esc(co.name)}</span><small>${countMasters(co.cities.map(c => c.id))} мастеров ›</small></button>`).join("")
    + `<div class="sheet-note">Скоро добавим другие страны.</div>`;
  $("sheet").hidden = false;
}
function openCountry(code) {
  const co = DATA.countries.find(c => c.code === code);
  $("sheetBody").innerHTML = `<button class="back" type="button" data-back="1" style="display:block">← Страны</button>
    <h3>${co.flag} ${esc(co.name)} — город</h3>` + co.cities.map(c => `
    <button class="city-opt" type="button" data-city="${c.id}" aria-pressed="${c.id === state.city}">
      <span>${esc(c.name)}</span><small>${countMasters([c.id])} мастеров</small></button>`).join("")
    + `<div class="sheet-note">Скоро добавим другие города.</div>`;
}
$("sheet").addEventListener("click", e => {
  const star = e.target.closest("[data-star]");
  if (star) { rv.rating = +star.dataset.star; paintStars(); if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (SHEET_ACTS.includes(a)) return sheetAction(a, act);
    if (a === "send-review") return sendReview();
    if (a === "close") return closeSheet();
    if (a === "chat") { const url = `https://t.me/${act.dataset.u}`; return inTg ? tg.openTelegramLink(url) : window.open(url, "_blank"); }
    if (a === "copy") {
      navigator.clipboard && navigator.clipboard.writeText(act.dataset.v).then(() => { act.textContent = "Скопировано ✓"; haptic("success"); });
      return;
    }
  }
  const country = e.target.closest("[data-country]");
  if (country) return openCountry(country.dataset.country);
  if (e.target.closest("[data-back]")) return openCities();
  const opt = e.target.closest("[data-city]");
  if (opt) setCity(+opt.dataset.city);
  if (opt || e.target === $("sheet")) $("sheet").hidden = true;
});
function setCity(id) {
  state.city = id; state.cat = "all";
  try { localStorage.setItem("navodka_city", id); } catch (e) {}
  if (tg && tg.CloudStorage) try { tg.CloudStorage.setItem("city", String(id)); } catch (e) {}
  renderBrand(); buildWheel(); $("wheel").scrollTop = 0; renderList();
}
function savedCity() {   // облако Telegram (на всех устройствах) → localStorage → первый город
  return new Promise(resolve => {
    let local = null;
    try { local = localStorage.getItem("navodka_city"); } catch (e) {}
    if (tg && tg.CloudStorage && inTg) {
      try { tg.CloudStorage.getItem("city", (err, v) => resolve(!err && v ? v : local)); return; } catch (e) {}
    }
    resolve(local);
  });
}

const loadCatalog = () => fetch(API + "/catalog.json", { cache: "no-store" }).then(r => r.json()).then(d => { DATA = d; });
loadCatalog()
  .then(async () => {
    const ids = allCities().map(c => c.id);
    const saved = +(await savedCity());
    state.city = ids.includes(saved) ? saved : ids[0];
    renderBrand(); buildWheel(); renderList();
    openFromLink();
  })
  .catch(() => { $("list").innerHTML = `<div class="empty">Не удалось загрузить каталог. Закрой и открой ещё раз.</div>`; });
</script>
</body>
