<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наводка — мастера Батуми</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Цвета берём из темы Telegram (--tg-theme-*), фирменные — только акценты */
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
  --fg: var(--tg-theme-text-color, #121a2e);
  --muted: var(--tg-theme-hint-color, #7a8296);
  --link: var(--tg-theme-link-color, #2a7de1);
  --line: color-mix(in srgb, var(--muted) 22%, transparent);
  --brand: #7c3aed;
  --brand-grad: linear-gradient(135deg, #d946ef, #4f1fe0);   /* как на аватарке бота */
  --star: #ffb800;
  --ok: #2fa66b;
  --row: 40px;   /* высота строки колеса */
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg2); color: var(--fg);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom, 0); }
.top { padding: 12px 16px 8px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 38px; height: 38px; border-radius: 50%; flex: none; display: block; }
.brand b { font-size: 18px; display: block; }
.city-btn { border: 0; background: none; padding: 0; font: inherit; font-size: 13px; color: var(--link); cursor: pointer; margin-top: -2px; }
/* шторка выбора города */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .35); display: flex; align-items: flex-end; }
.sheet-body { background: var(--bg); width: 100%; max-height: 75vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0)); display: grid; gap: 6px; }
.sheet-body h3 { margin: 0 0 6px; font-size: 17px; }
.country { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
.city-opt { border: 0; background: var(--bg2); border-radius: 12px; padding: 12px 14px; font: inherit; color: var(--fg);
  text-align: left; display: flex; justify-content: space-between; cursor: pointer; }
.city-opt[aria-pressed="true"] { outline: 2px solid var(--brand); }
.city-opt small { color: var(--muted); }
.sheet-note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.search { width: 100%; border: 0; border-radius: 12px; padding: 10px 12px; font: inherit;
  background: var(--bg); color: var(--fg); outline: none; }
.search::placeholder { color: var(--muted); }

/* колесо категорий, как барабан времени в iOS */
.wheel { position: relative; height: calc(var(--row) * 5); background: var(--bg); border-radius: 16px; overflow: hidden; }
.wheel-track { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none;
  padding: calc(var(--row) * 2) 0; perspective: 600px; -webkit-overflow-scrolling: touch; }
.wheel-track::-webkit-scrollbar { display: none; }
.wheel-item { height: var(--row); scroll-snap-align: center; display: flex; align-items: center; justify-content: center;
  gap: 6px; font-size: 17px; cursor: pointer; user-select: none; transform-origin: center; will-change: transform, opacity; }
.wheel-item small { color: var(--muted); font-size: 13px; }
.wheel-lens { position: absolute; left: 10px; right: 10px; top: calc(var(--row) * 2); height: var(--row);
  border-radius: 10px; background: color-mix(in srgb, var(--fg) 7%, transparent); pointer-events: none; }
.wheel::before, .wheel::after { content: ""; position: absolute; left: 0; right: 0; height: calc(var(--row) * 1.6);
  pointer-events: none; z-index: 1; }
.wheel::before { top: 0; background: linear-gradient(var(--bg), transparent); }
.wheel::after { bottom: 0; background: linear-gradient(transparent, var(--bg)); }
/* на компьютере (мышь) показываем полосу прокрутки, чтобы было видно, что колесо листается */
@media (hover: hover) and (pointer: fine) {
  .wheel-track { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 60%, transparent) transparent; }
  .wheel-track::-webkit-scrollbar { display: block; width: 6px; }
  .wheel-track::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 60%, transparent); border-radius: 3px; }
  .wheel::before, .wheel::after { right: 10px; }   /* градиенты не закрывают полосу */
  .wheel-lens { right: 16px; }
}
.hint { color: var(--muted); font-size: 13px; padding: 0 4px; }

.list { padding: 4px 16px 24px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--bg); border-radius: 16px; padding: 14px; display: grid; gap: 6px; cursor: pointer;
  border: 0; text-align: left; font: inherit; color: inherit; width: 100%; }
.card:active { opacity: .85; }
.name { font-weight: 650; font-size: 16px; }
.cats { color: var(--muted); font-size: 13px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.badge { background: var(--bg2); border-radius: 8px; padding: 2px 8px; }
.badge.star b { color: var(--star); }
.badge.rec b { color: var(--ok); }
.price { font-size: 13px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }

/* карточка мастера */
.detail { padding: 12px 16px 120px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.panel { background: var(--bg); border-radius: 16px; padding: 16px; display: grid; gap: 8px; }
.panel h2 { margin: 0; font-size: 21px; }
.panel h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.review { border-top: 1px solid var(--line); padding-top: 8px; }
.review:first-of-type { border-top: 0; padding-top: 0; }
.review .stars { color: var(--star); letter-spacing: 1px; }
.quote { border-left: 3px solid var(--ok); padding-left: 10px; }
.note { color: var(--muted); font-size: 13px; }
.cta { display: none; position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0));
  border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 650; background: var(--brand-grad); color: #fff; }
body.no-tg .cta.show { display: block; }
.back { border: 0; background: none; color: var(--link); font: inherit; padding: 0; cursor: pointer; justify-self: start; }
body:not(.no-tg) .back { display: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="home">
  <div class="top">
    <div class="brand" id="brand"></div>
    <input class="search" id="q" type="search" placeholder="Что нужно сделать? Например: повесить полку">
    <div class="wheel" id="wheelBox"><div class="wheel-lens"></div><div class="wheel-track" id="wheel"></div></div>
  </div>
  <div class="list" id="list"></div>
</div>
<div id="detail" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody"></div></div>
<button class="cta" id="cta" type="button">✉️ Написать мастеру</button>

<script>
const BOT = "navodkaprobot";
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (!inTg) document.body.classList.add("no-tg");
if (tg) { tg.ready(); tg.expand(); }

const LOGO = `<img src="logo.jpg" alt="">`;   // аватарка бота

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let DATA = { categories: [], masters: [] };
let state = { city: null, cat: "all", q: "", open: null, scroll: 0 };
let WHEEL = [];   // [{key, title}] — первая строка «Все мастера»
const catTitle = k => (DATA.categories.find(c => c.key === k) || {}).title || k;
const score = m => (m.reviews_count + m.recs.length) * 10 + (m.rating || 0);

function contact(id) {
  const url = `https://t.me/${BOT}?start=c_${id}`;
  if (inTg) { tg.openTelegramLink(url); tg.close(); } else { window.open(url, "_blank"); }
}

// ---------- поиск: по мастеру и по словам задач его категорий ----------
function haystack(m) {
  const kw = m.categories.map(k => (DATA.categories.find(c => c.key === k) || {}).keywords || "");
  return [m.name, m.description, m.prices, m.district, ...m.categories.map(catTitle), ...kw].join(" ").toLowerCase();
}
function matches(m, q) {
  const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return true;
  const h = haystack(m);
  // сравниваем по основе слова, чтобы «полку» нашло «полка», а «повесить» — «повесить»
  const stem = w => w.length > 5 ? w.slice(0, 5) : w.slice(0, Math.max(3, w.length - 1));
  return words.some(w => h.includes(stem(w)));
}
const inCity = () => DATA.masters.filter(m => m.city_id === state.city);
function filtered() {
  return inCity()
    .filter(m => state.q.trim() ? true : state.cat === "all" || m.categories.includes(state.cat))
    .filter(m => matches(m, state.q))
    .sort((a, b) => score(b) - score(a));
}

// ---------- колесо ----------
function buildWheel() {
  const ms = inCity();
  const counts = Object.fromEntries(DATA.categories.map(c => [c.key, ms.filter(m => m.categories.includes(c.key)).length]));
  WHEEL = [{ key: "all", title: "Все мастера", n: ms.length }].concat(DATA.categories.map(c => ({ ...c, n: counts[c.key] })));
  $("wheel").innerHTML = WHEEL.map((c, i) => `<div class="wheel-item" data-i="${i}">${esc(c.title)}<small>${c.n}</small></div>`).join("");
  paintWheel();
}
const rowH = () => $("wheel").querySelector(".wheel-item").offsetHeight;
function paintWheel() {
  const t = $("wheel"), pos = t.scrollTop / rowH();
  t.querySelectorAll(".wheel-item").forEach((el, i) => {
    const d = i - pos;
    el.style.transform = `rotateX(${Math.max(-70, Math.min(70, -d * 20))}deg)`;
    el.style.opacity = Math.max(0.15, 1 - Math.abs(d) * 0.3);
    el.style.fontWeight = Math.abs(d) < 0.5 ? 650 : 400;
  });
}
let lastIdx = 0, settle;
$("wheel").addEventListener("scroll", () => {
  paintWheel();
  const idx = Math.round($("wheel").scrollTop / rowH());
  if (idx !== lastIdx) { lastIdx = idx; if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }
  clearTimeout(settle);
  settle = setTimeout(() => {
    const c = WHEEL[idx];
    if (c && c.key !== state.cat) { state.cat = c.key; if (state.q) { state.q = ""; $("q").value = ""; } renderList(); }
  }, 120);
}, { passive: true });
$("wheel").addEventListener("click", e => {
  const it = e.target.closest(".wheel-item");
  if (it) $("wheel").scrollTo({ top: +it.dataset.i * rowH(), behavior: "smooth" });
});

// ---------- список ----------
function badges(m) {
  const out = [];
  if (m.rating) out.push(`<span class="badge star"><b>★ ${m.rating.toFixed(1)}</b> · ${m.reviews_count} отз.</span>`);
  if (m.recs.length) out.push(`<span class="badge rec"><b>👍 ${m.recs.length}</b> в чатах</span>`);
  if (m.district) out.push(`<span class="badge">📍 ${esc(m.district)}</span>`);
  return out.join("");
}
function renderList() {
  const rows = filtered();
  const head = state.q.trim() ? `<div class="hint">Поиск по всем категориям: «${esc(state.q.trim())}»</div>` : "";
  $("list").innerHTML = head + (rows.length ? rows.map(m => `
    <button class="card" type="button" data-id="${m.id}">
      <span class="name">${esc(m.name)}</span>
      <div class="cats">${m.categories.map(catTitle).map(esc).join(" · ")}</div>
      <div class="badges">${badges(m)}</div>
      ${m.prices ? `<div class="price">💰 ${esc(m.prices)}</div>` : ""}
    </button>`).join("") : `<div class="empty">${state.q.trim() ? "Никого не нашли — попробуй сказать иначе или выбери категорию." : "В этой категории пока никого — скоро добавим мастеров."}</div>`);
}
$("q").addEventListener("input", () => { state.q = $("q").value; renderList(); });
$("list").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) { state.scroll = window.scrollY; openDetail(+card.dataset.id); }
});

// ---------- карточка мастера ----------
function openDetail(id) {
  const m = DATA.masters.find(x => x.id === id);
  if (!m) return;
  state.open = id;
  $("detail").innerHTML = `
    <div class="detail">
      <button class="back" type="button" id="back">← Назад</button>
      <div class="panel">
        <h2>${esc(m.name)}</h2>
        <div class="cats">${m.categories.map(catTitle).map(esc).join(" · ")}</div>
        <div class="badges">${badges(m)}</div>
        ${m.description ? `<div>${esc(m.description)}</div>` : ""}
        ${m.prices ? `<div>💰 ${esc(m.prices)}</div>` : ""}
      </div>
      ${m.reviews.length ? `<div class="panel"><h3>Отзывы клиентов</h3>${m.reviews.map(r => `
        <div class="review"><div class="stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</div><div>${esc(r.text)}</div><div class="note">${esc(r.date)}</div></div>`).join("")}</div>` : ""}
      ${m.recs.length ? `<div class="panel"><h3>Рекомендации в чатах Батуми</h3>${m.recs.slice(0, 5).map(q => `<div class="quote">«${esc(q)}»</div>`).join("")}</div>` : ""}
      <p class="note">Контакт откроется в боте Наводки. Через пару дней бот спросит, как всё прошло, — твой отзыв поможет другим.</p>
    </div>`;
  $("home").hidden = true; $("detail").hidden = false;
  window.scrollTo(0, 0);
  $("back").addEventListener("click", closeDetail);
  if (tg) {
    tg.BackButton.show();
    tg.MainButton.setParams({ text: "✉️ Написать мастеру", color: "#7C3AED", text_color: "#FFFFFF", is_visible: true });
  }
  $("cta").classList.add("show");
}
function closeDetail() {
  state.open = null;
  $("detail").hidden = true; $("home").hidden = false;
  window.scrollTo(0, state.scroll);
  $("cta").classList.remove("show");
  if (tg) { tg.MainButton.hide(); tg.BackButton.hide(); }
}
$("cta").addEventListener("click", () => state.open && contact(state.open));
if (tg) {
  tg.BackButton.onClick(closeDetail);
  tg.MainButton.onClick(() => state.open && contact(state.open));
}

// ---------- город ----------
const allCities = () => DATA.countries.flatMap(c => c.cities.map(x => ({ ...x, country: c.name, flag: c.flag })));
function cityLabel() {
  const c = allCities().find(x => x.id === state.city);
  return c ? `📍 ${c.country}, ${c.name} ▾` : "📍 Выбрать город ▾";
}
const countMasters = ids => DATA.masters.filter(m => ids.includes(m.city_id)).length;
function renderBrand() {
  $("brand").innerHTML = `${LOGO}<div><b>Наводка</b><button class="city-btn" id="cityBtn" type="button">${esc(cityLabel())}</button></div>`;
  $("cityBtn").addEventListener("click", openCities);
}
// шаг 1 — страна, шаг 2 — город
function openCities() {
  const cur = allCities().find(x => x.id === state.city);
  $("sheetBody").innerHTML = `<h3>Страна</h3>` + DATA.countries.map(co => `
    <button class="city-opt" type="button" data-country="${co.code}" aria-pressed="${!!cur && cur.country === co.name}">
      <span>${co.flag} ${esc(co.name)}</span><small>${countMasters(co.cities.map(c => c.id))} мастеров ›</small></button>`).join("")
    + `<div class="sheet-note">Скоро добавим другие страны.</div>`;
  $("sheet").hidden = false;
}
function openCountry(code) {
  const co = DATA.countries.find(c => c.code === code);
  $("sheetBody").innerHTML = `<button class="back" type="button" data-back="1" style="display:block">← Страны</button>
    <h3>${co.flag} ${esc(co.name)} — город</h3>` + co.cities.map(c => `
    <button class="city-opt" type="button" data-city="${c.id}" aria-pressed="${c.id === state.city}">
      <span>${esc(c.name)}</span><small>${countMasters([c.id])} мастеров</small></button>`).join("")
    + `<div class="sheet-note">Скоро добавим другие города.</div>`;
}
$("sheet").addEventListener("click", e => {
  const country = e.target.closest("[data-country]");
  if (country) return openCountry(country.dataset.country);
  if (e.target.closest("[data-back]")) return openCities();
  const opt = e.target.closest("[data-city]");
  if (opt) setCity(+opt.dataset.city);
  if (opt || e.target === $("sheet")) $("sheet").hidden = true;
});
function setCity(id) {
  state.city = id; state.cat = "all";
  try { localStorage.setItem("navodka_city", id); } catch (e) {}
  if (tg && tg.CloudStorage) try { tg.CloudStorage.setItem("city", String(id)); } catch (e) {}
  renderBrand(); buildWheel(); $("wheel").scrollTop = 0; renderList();
}
function savedCity() {   // облако Telegram (на всех устройствах) → localStorage → первый город
  return new Promise(resolve => {
    let local = null;
    try { local = localStorage.getItem("navodka_city"); } catch (e) {}
    if (tg && tg.CloudStorage && inTg) {
      try { tg.CloudStorage.getItem("city", (err, v) => resolve(!err && v ? v : local)); return; } catch (e) {}
    }
    resolve(local);
  });
}

fetch("catalog.json", { cache: "no-store" })
  .then(r => r.json())
  .then(async d => {
    DATA = d;
    const ids = allCities().map(c => c.id);
    const saved = +(await savedCity());
    state.city = ids.includes(saved) ? saved : ids[0];
    renderBrand(); buildWheel(); renderList();
  })
  .catch(() => { $("list").innerHTML = `<div class="empty">Не удалось загрузить каталог. Закрой и открой ещё раз.</div>`; });
</script>
</body>
</html>
